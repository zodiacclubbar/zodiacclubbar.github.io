<head>

  <meta property="og:image:secure_url" content="https://zodiacclubbar.github.io/og-card.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ZODIAC CLUB BAR — Menu & Official Links">
  <meta name="twitter:description" content="View our menu, event schedule, Google Maps, Facebook, Instagram & TikTok.">
  <meta name="twitter:image" content="https://zodiacclubbar.github.io/og-card.jpg">
  <meta name="theme-color" content="#0B0B0F">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261120hotline">
</head>
<body class="theme-bar">
  <div class="hero-backdrop" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <main class="page">
    <header class="hero">
      <h1 class="brand" data-brand></h1>
      <p class="tagline" data-tagline>Menu & Official Links</p>
      <div class="hero-rule" aria-hidden="true"></div>
    </header>

    <article class="link-card hotline-card" aria-label="Hotline">
      <a class="link-main" href="tel:+84327000272">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <span class="link-text">
          <span class="link-title">Hotline</span>
          <span class="link-sub hotline-number">+84-327-000-272</span>
        </span>
      </a>
      <button type="button" class="copy-btn" id="copy-hotline" data-copy-value="+84-327-000-272">Copy</button>
    </article>

    <button type="button" class="menu-btn" id="menu-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.2l1.2-2h6.2l1.2 2h1.2A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-8z"/>
  <circle cx="12" cy="12.2" r="3.2"/>
</svg>
      <span class="label">
        <span class="ko">Menu</span>
        <span class="en" data-menu-meta>MENU</span>
      </span>
    </button>

    <button type="button" class="menu-btn event-btn" id="event-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M12 13l1 2 2.2.3-1.6 1.5.4 2.2-2-1.1-2 1.1.4-2.2-1.6-1.5 2.2-.3z"/>
</svg>
      <span class="label">
        <span class="ko">Events</span>
        <span class="en" data-event-meta>UPCOMING SCHEDULE</span>
      </span>
    </button>

    <h2 class="section-label">Official Links</h2>
    <section class="links" id="links"></section>

    <section class="share">
      <p>This is the same link as the QR code. Copy and share it anywhere.</p>
      <button type="button" class="share-btn" id="share-copy">Copy Page Link</button>
      <p class="page-url" data-page-url></p>
    </section>

    <p class="footer" data-brand></p>
  </main>

  <div class="modal" id="menu-modal" role="dialog" aria-modal="true" aria-labelledby="menu-title">
    <div class="modal-head">
      <div class="modal-row">
        <h2 class="modal-title" id="menu-title">ZODIAC MENU</h2>
        <button type="button" class="close-btn" id="close-menu" aria-label="Close">✕</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <div class="lightbox-bar">
      <span id="lb-cap"></span>
      <button type="button" class="close-btn" id="lb-close" aria-label="Close">✕</button>
    </div>
    <div class="lightbox-stage" id="lb-stage">
      <button type="button" class="lightbox-nav prev" id="lb-prev" aria-label="Previous">‹</button>
      <img id="lb-img" alt="">
      <button type="button" class="lightbox-nav next" id="lb-next" aria-label="Next">›</button>
    </div>
    <div class="lightbox-tools">
      <span class="zoom-hint">Pinch or double-tap to zoom</span>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js?v=20261121aespa"></script>
  <script src="js/app.js?v=20261121pinch"></script>
</body>
</html>
